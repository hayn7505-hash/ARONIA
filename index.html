<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARONIA | متجر الجمال والعناية</title>

  <script src="products.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fffaf8;
      color: #3d3030;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0dddd;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #c77d7d;
    }

    .cart {
      border: none;
      background: #f8e3e0;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 17px;
    }

    .hero {
      margin: 20px;
      padding: 30px 22px;
      border-radius: 25px;
      background: linear-gradient(135deg, #f8e2df, #f7eee8);
    }

    .hero h1 {
      font-size: 29px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #765f5f;
      line-height: 1.8;
      margin-bottom: 18px;
    }

    .hero button {
      border: none;
      background: #c77d7d;
      color: white;
      padding: 12px 23px;
      border-radius: 25px;
      cursor: pointer;
    }

    section {
      padding: 10px 20px 25px;
    }

    .title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .title h2 {
      font-size: 21px;
    }

    .title span {
      color: #c77d7d;
      font-size: 14px;
    }

    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .category {
      min-width: 100px;
      background: white;
      border: 1px solid #f0dddd;
      border-radius: 18px;
      padding: 15px 10px;
      text-align: center;
    }

    .category-icon {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .category p {
      font-size: 13px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border: 1px solid #f0dddd;
      border-radius: 20px;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #f8eee9;
    }

    .product-info {
      padding: 12px;
    }

    .product-info h3 {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .product-info p {
      color: #8a7777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .price {
      color: #b86f6f;
      font-weight: bold;
      font-size: 16px;
    }

    .add {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      border: none;
      background: #f3d6d2;
      color: #694b4b;
      border-radius: 12px;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: white;
      border-top: 1px solid #f0dddd;
      display: flex;
      justify-content: space-around;
      padding: 9px 4px;
    }

    nav div {
      text-align: center;
      font-size: 12px;
      color: #776565;
    }

    nav div:first-child {
      color: #c77d7d;
      font-weight: bold;
    }

    main {
      padding-bottom: 75px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }

      section {
        max-width: 1000px;
        margin: auto;
      }

      .hero {
        max-width: 900px;
        margin: 25px auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ARONIA</div>

  <button class="cart">
    🛒 <span id="cartCount">0</span>
  </button>
</header>

<main>

  <div class="hero">
    <h1>جمالك يبدأ من هنا ✨</h1>

    <p>
      اكتشفي منتجات العناية بالبشرة والجمال
      المختارة بعناية لتناسب روتينك اليومي.
    </p>
    <button onclick="scrollToProducts()">
      تسوقي الآن
    </button>
  </div>

  <section>

    <div class="title">
      <h2>الأقسام</h2>
      <span>عرض الكل</span>
    </div>

    <div class="categories">

      <div class="category">
        <div class="category-icon">🧴</div>
        <p>العناية بالبشرة</p>
      </div>

      <div class="category">
        <div class="category-icon">💄</div>
        <p>المكياج</p>
      </div>

      <div class="category">
        <div class="category-icon">🧖‍♀️</div>
        <p>العناية بالشعر</p>
      </div>

      <div class="category">
        <div class="category-icon">🌸</div>
        <p>العطور</p>
      </div>

    </div>

  </section>

  <section id="productsSection">

    <div class="title">
      <h2>منتجات مميزة</h2>
      <span>عرض الكل</span>
    </div>

    <div class="products" id="productsContainer"></div>

  </section>

</main>

<nav>

  <div>🏠<br>الرئيسية</div>

  <div>🛍️<br>الأقسام</div>

  <div>❤️<br>المفضلة</div>

  <div>🛒<br>السلة</div>

  <div>👤<br>حسابي</div>

</nav>

<script>

let cartCount = 0;

function addToCart() {

  cartCount++;

  document.getElementById("cartCount").textContent = cartCount;

}

function displayProducts() {

  const container =
    document.getElementById("productsContainer");

  container.innerHTML = "";

  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "product";

    card.innerHTML = 

      <img
        src="${product.image}"
        alt="${product.nameAr}"
      >

      <div class="product-info">

        <h3>${product.nameAr}</h3>

        <p>${product.category}</p>

        <div class="price">
          ${product.price.toLocaleString("ar-IQ")} د.ع
        </div>

        <button
          class="add"
          onclick="addToCart()"
        >
          أضف للسلة
        </button>

      </div>

    ;

    container.appendChild(card);

  });

}

function scrollToProducts() {

  document
    .getElementById("productsSection")
    .scrollIntoView({
      behavior: "smooth"
    });

}

displayProducts();

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

const supabaseClient = window.supabase.createClient(

);

supabaseClient.auth.onAuthStateChange(async (event, session) => {

  if (event === "PASSWORD_RECOVERY") {

    const newPassword = prompt("🔐 أدخل كلمة السر الجديدة:");

    if (!newPassword) return;

    if (newPassword.length < 6) {
      alert("كلمة السر يجب أن تكون 6 أحرف أو أكثر.");
      return;
    }

    const { error } =
      await supabaseClient.auth.updateUser({
        password: newPassword
      });

    if (error) {
      alert("حدث خطأ: " + error.message);
    } else {
      alert("تم تغيير كلمة السر بنجاح ✅");
      window.location.href = "admin.html";
    }
  }

});
</script>
</body>
</html>
