<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARONIA | لوحة المدير</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f5f2;
  color:#333;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0000000d;
}
.logo{
  font-size:28px;
  font-weight:bold;
  color:#b78383;
  text-align:center;
  margin-bottom:20px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
button{
  border:0;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}
.primary{
  background:#b78383;
  color:white;
}
.danger{
  background:#d9534f;
  color:white;
}
.edit{
  background:#eee;
}
.hidden{display:none}
.login{
  max-width:420px;
  margin:70px auto;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.stat{
  text-align:center;
  background:#faf7f5;
  padding:20px;
  border-radius:15px;
}
.stat b{
  display:block;
  font-size:28px;
  color:#b78383;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px 8px;
  border-bottom:1px solid #eee;
  text-align:right;
}
.product-img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:10px;
}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.message{
  margin-top:10px;
  color:#b33;
}
@media(max-width:700px){
  .stats{grid-template-columns:1fr}
  table{font-size:13px}
  th:nth-child(1),td:nth-child(1){display:none}
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<div id="loginPage" class="login container">
  <div class="card">
    <div class="logo">ARONIA</div>

    <h2>لوحة المدير</h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button class="primary" style="width:100%" onclick="login()">
      تسجيل الدخول
    </button>

    <div id="loginMessage" class="message"></div>
  </div>
</div>


<!-- لوحة التحكم -->
<div id="dashboard" class="container hidden">

  <div class="top card">
    <div>
      <div class="logo" style="margin:0;text-align:right">ARONIA</div>
      <small>لوحة إدارة المتجر</small>
    </div>

    <button class="danger" onclick="logout()">تسجيل الخروج</button>
  </div>


  <!-- الإحصائيات -->
  <div class="stats">

    <div class="stat">
      <span>المنتجات</span>
      <b id="productCount">0</b>
    </div>

    <div class="stat">
      <span>إجمالي المخزون</span>
      <b id="stockCount">0</b>
    </div>

    <div class="stat">
      <span>قيمة المنتجات</span>
      <b id="valueCount">0</b>
    </div>

  </div>


  <!-- إضافة / تعديل -->
  <div class="card">

    <h2 id="formTitle">إضافة منتج</h2>

    <input id="productName" placeholder="اسم المنتج بالإنجليزية">

    <input id="productNameAr" placeholder="اسم المنتج بالعربية">

    <select id="productCategory">
      <option value="العناية بالبشرة">العناية بالبشرة</option>
      <option value="المكياج">المكياج</option>
      <option value="العناية بالشعر">العناية بالشعر</option>
      <option value="العطور">العطور</option>
    </select>

    <input id="productPrice" type="number" placeholder="السعر بالدينار العراقي">

    <input id="productStock" type="number" placeholder="الكمية">

    <input id="productImage" placeholder="رابط صورة المنتج">

    <textarea id="productDescription" placeholder="وصف المنتج"></textarea>

    <button class="primary" onclick="saveProduct()">
      حفظ المنتج
    </button>

    <button class="edit hidden" id="cancelBtn" onclick="cancelEdit()">
      إلغاء التعديل
    </button>

    <div id="formMessage" class="message"></div>

  </div>


  <!-- المنتجات -->
  <div class="card">
    <div class="top">
      <h2>المنتجات</h2>

      <button class="primary" onclick="loadProducts()">
        تحديث
      </button>
    </div>

    <div style="overflow-x:auto">

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>الصورة</th>
            <th>المنتج</th>
            <th>الفئة</th>
            <th>السعر</th>
            <th>المخزون</th>
            <th>إجراءات</th>
          </tr>
        </thead>

        <tbody id="productsTable"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

/* =========================
   بيانات Supabase
========================= */

const SUPABASE_URL = "https://hlnbnczvmdgqsaldfqyw.supabase.co/rest/v1/";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_ZIO0-w4_OIfsS1DumgaMJQ_Z_G5DIvV";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   تسجيل الدخول
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "جاري تسجيل الدخول...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    message.textContent =
      "فشل تسجيل الدخول: " + error.message;

    return;
  }


  await checkAdmin();

}


/* =========================
   التحقق من المدير
========================= */

async function checkAdmin(){

  const { data:{ session } } =
    await supabaseClient.auth.getSession();


  if(!session){

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("dashboard")
      .classList.add("hidden");

    return;
  }


  const { data, error } =
    await supabaseClient.rpc("is_admin");


  if(error || data !== true){

    await supabaseClient.auth.signOut();

    document
      .getElementById("loginMessage")
      .textContent =
      "هذا الحساب ليس مديراً.";

    return;
  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  loadProducts();

}


/* =========================
   تسجيل الخروج
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================
   تحميل المنتجات
========================= */

let products = [];
let editingId = null;


async function loadProducts(){

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", {ascending:false});


  if(error){

    alert("خطأ في تحميل المنتجات: " + error.message);

    return;
  }


  products = data || [];

  renderProducts();

}


/* =========================
   عرض المنتجات
========================= */

function renderProducts(){

  const table =
    document.getElementById("productsTable");

  table.innerHTML = "";


  let totalStock = 0;
  let totalValue = 0;


  products.forEach(product => {

    totalStock += Number(product.stock || 0);

    totalValue +=
      Number(product.price || 0) *
      Number(product.stock || 0);


    const row =
      document.createElement("tr");


    const id =
      document.createElement("td");

    id.textContent = product.id;


    const imageCell =
      document.createElement("td");

    const image =
      document.createElement("img");

    image.src =
      product.image ||
      "https://placehold.co/100";

    image.className =
      "product-img";

    imageCell.appendChild(image);


    const name =
      document.createElement("td");

    name.textContent =
      product.name_ar ||
      product.name ||
      "-";


    const category =
      document.createElement("td");

    category.textContent =
      product.category || "-";


    const price =
      document.createElement("td");

    price.textContent =
      Number(product.price || 0)
      .toLocaleString("ar-IQ") + " د.ع";
const stock =
      document.createElement("td");

    stock.textContent =
      product.stock ?? 0;


    const actions =
      document.createElement("td");

    const actionBox =
      document.createElement("div");

    actionBox.className = "actions";


    const editButton =
      document.createElement("button");

    editButton.className = "edit";

    editButton.textContent = "تعديل";

    editButton.onclick =
      () => editProduct(product.id);


    const deleteButton =
      document.createElement("button");

    deleteButton.className = "danger";

    deleteButton.textContent = "حذف";

    deleteButton.onclick =
      () => deleteProduct(product.id);


    actionBox.appendChild(editButton);

    actionBox.appendChild(deleteButton);

    actions.appendChild(actionBox);


    row.appendChild(id);
    row.appendChild(imageCell);
    row.appendChild(name);
    row.appendChild(category);
    row.appendChild(price);
    row.appendChild(stock);
    row.appendChild(actions);


    table.appendChild(row);

  });


  document.getElementById("productCount")
    .textContent = products.length;


  document.getElementById("stockCount")
    .textContent = totalStock.toLocaleString("ar-IQ");


  document.getElementById("valueCount")
    .textContent =
      totalValue.toLocaleString("ar-IQ") + " د.ع";

}


/* =========================
   إضافة / تعديل
========================= */

async function saveProduct(){

  const name =
    document.getElementById("productName").value.trim();

  const nameAr =
    document.getElementById("productNameAr").value.trim();

  const category =
    document.getElementById("productCategory").value;

  const price =
    Number(document.getElementById("productPrice").value);

  const stock =
    Number(document.getElementById("productStock").value);

  const image =
    document.getElementById("productImage").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();


  if(!nameAr || !price){

    document.getElementById("formMessage")
      .textContent =
      "أدخل اسم المنتج والسعر.";

    return;
  }


  const productData = {

    name,
    name_ar: nameAr,
    category,
    price,
    stock,
    image,
    description

  };


  let result;


  if(editingId){

    result =
      await supabaseClient
        .from("products")
        .update(productData)
        .eq("id", editingId);

  }else{

    result =
      await supabaseClient
        .from("products")
        .insert(productData);

  }


  if(result.error){

    document.getElementById("formMessage")
      .textContent =
      "حدث خطأ: " + result.error.message;

    return;
  }


  document.getElementById("formMessage")
    .textContent =
    editingId
      ? "تم تعديل المنتج ✅"
      : "تمت إضافة المنتج ✅";


  cancelEdit();

  loadProducts();

}


/* =========================
   تعديل المنتج
========================= */

function editProduct(id){

  const product =
    products.find(p => p.id === id);


  if(!product) return;


  editingId = id;


  document.getElementById("formTitle")
    .textContent = "تعديل المنتج";


  document.getElementById("productName")
    .value = product.name || "";


  document.getElementById("productNameAr")
    .value = product.name_ar || "";


  document.getElementById("productCategory")
    .value = product.category || "العناية بالبشرة";


  document.getElementById("productPrice")
    .value = product.price || "";


  document.getElementById("productStock")
    .value = product.stock || 0;


  document.getElementById("productImage")
    .value = product.image || "";


  document.getElementById("productDescription")
    .value = product.description || "";


  document.getElementById("cancelBtn")
    .classList.remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   إلغاء التعديل
========================= */

function cancelEdit(){

  editingId = null;


  document.getElementById("formTitle")
    .textContent = "إضافة منتج";


  document.getElementById("productName").value = "";
  document.getElementById("productNameAr").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productStock").value = "";

  document.getElementById("productImage").value = "";

  document.getElementById("productDescription").value = "";


  document.getElementById("cancelBtn")
    .classList.add("hidden");

}


/* =========================
   حذف المنتج
========================= */

async function deleteProduct(id){

  if(!confirm("هل تريد حذف هذا المنتج؟")) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if(error){

    alert("فشل الحذف: " + error.message);

    return;
  }


  loadProducts();

}


/* =========================
   تشغيل الصفحة
========================= */

checkAdmin();

</script>

</body>
</html>
